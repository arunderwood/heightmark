name: Release to Google Play Store

# workflow_run is how a release waits for a green CI run. The check-tip job's
# `if:` admits only pushes from this repository, and the checkout pins the
# tested SHA, so no fork-controlled code or ref reaches the signing secrets.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Android CI"]
    branches: [main]
    types:
      - completed

permissions: {}

# The Play Publishing API allows only one open edit per app, so concurrent
# release runs (e.g. from a Dependabot merge batch) invalidate each other.
# Serialize them; intermediate queued runs are superseded by the newest.
concurrency:
  group: play-store-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false

jobs:
  # Releases only main's tip. When a batch of merges lands, the newest commit's
  # release ships every earlier change, so releasing a superseded commit only
  # spends a Play upload. It also fails at the tag: GITHUB_TOKEN may not tag a
  # commit behind main once a later merge has changed workflow files.
  check-tip:
    name: Check commit is main's tip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The `branches` filter above matches the triggering run's head branch, so
    # a fork PR from a branch named `main` also passes it. Only a push to this
    # repository may reach the release job and its signing secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - name: Compare with main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_sha" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release skipped::main has moved to ${main_sha:0:7}; its release ships ${HEAD_SHA:0:7} too."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Computed once here so the release and the rebuild get the same values.
      - name: Calculate version
        id: version
        run: |
          # Base offset to allow room for manual releases
          BASE_CODE=10000
          VERSION_PREFIX="1.0"

          VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          VERSION_NAME="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"

          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "📦 Building version: ${VERSION_NAME} (versionCode: ${VERSION_CODE})"

  release:
    name: Build & Release to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-tip
    if: needs.check-tip.outputs.current == 'true'
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.check-tip.outputs.version-name }}
      VERSION_CODE: ${{ needs.check-tip.outputs.version-code }}

    steps:
      # Build the commit CI tested. The workflow_run default is the newest main
      # commit, which may not have passed CI yet.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Outside the workspace, so no artifact upload glob can reach them.
      - name: Decode keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIDELOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/

      # The AAB's key is only Play's upload credential: Play App Signing
      # re-signs every Play install with a key Google holds. Sideloaded APKs
      # (GitHub releases, Obtainium) carry a dedicated key instead, so a leaked
      # or reset upload key never reaches users who installed from GitHub.
      # The sideload keystore is PKCS12, which has one password for the store
      # and the key, so one secret fills both Gradle fields.
      - name: Build sideload APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/sideload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk "dist/heightmark-v${VERSION_NAME}.apk"

      - name: Clean up keystores
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/sideload.keystore"

      # Android refuses an update whose signer differs from the installed one,
      # so an APK signed by the wrong key would strand every user who installs
      # it. The pin lives here, not in a repository variable, so changing it
      # takes a reviewed commit. It must match the fingerprint in Readme.md.
      - name: Verify sideload APK signer
        env:
          EXPECTED_CERT_SHA256: "21:71:C5:4B:AD:49:79:4A:3B:C3:57:A6:2B:14:9C:DB:9C:08:A8:C0:65:82:EB:CB:BA:53:90:A6:95:A3:A8:68"
        run: |
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=No signer pin::EXPECTED_CERT_SHA256 is not a SHA-256 fingerprint."
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "dist/heightmark-v${VERSION_NAME}.apk" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          # The line prefix varies by build-tools version ("Signer #1" through
          # 36, one "V2 Signer:"/"V3.0 Signer:" line per scheme from 37), so
          # match on the suffix and dedupe. A second signer leaves two values.
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Wrong signer::Expected one signer with SHA-256 $expected, got: ${actual:-none}"
            exit 1
          fi

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.bizzarosn.heightmark
          releaseFiles: dist/app-release.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: metadata/whatsnew

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-v${{ needs.check-tip.outputs.version-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # A second build of the sideload APK from the same commit and version, on a
  # machine that differs where a rebuilder's can: another checkout path, an
  # empty Gradle home with no build cache, and no NDK. It runs beside the
  # release job, so it adds little to the release's wall clock.
  rebuild:
    name: Rebuild sideload APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-tip
    if: needs.check-tip.outputs.current == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          path: rebuild/heightmark

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # No cache: every task runs and every dependency downloads, so nothing
      # from the release job or an earlier run can stand in for this build.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # The release job's runner has NDKs installed. Hiding them here checks
      # that the APK does not depend on one being present. A rename within the
      # SDK directory is instant.
      - name: Hide the NDK
        run: |
          for dir in ndk ndk-bundle; do
            if [ -e "$ANDROID_HOME/$dir" ]; then
              sudo mv "$ANDROID_HOME/$dir" "$ANDROID_HOME/$dir.hidden"
            fi
          done

      - name: Build unsigned sideload APK
        working-directory: rebuild/heightmark
        env:
          VERSION_NAME: ${{ needs.check-tip.outputs.version-name }}
          VERSION_CODE: ${{ needs.check-tip.outputs.version-code }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-apk-v${{ needs.check-tip.outputs.version-name }}
          path: rebuild/heightmark/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  # Publishes nothing unless the signed sideload APK is reproducible: its
  # signature, copied onto the rebuild, must yield the same bytes. This is the
  # check Readme.md gives users. apksigcopier comes from PyPI, so it runs here,
  # in a job with no token permissions, and never in publish.
  verify-reproducible:
    name: Verify sideload APK is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-tip, release, rebuild]
    permissions: {}
    env:
      VERSION_NAME: ${{ needs.check-tip.outputs.version-name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-v${{ needs.check-tip.outputs.version-name }}
          path: dist

      - name: Download rebuilt APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-apk-v${{ needs.check-tip.outputs.version-name }}
          path: rebuilt

      - name: Compare
        run: |
          pip install --quiet apksigcopier==1.1.1
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export PATH="$build_tools:$PATH"
          signed="dist/heightmark-v${VERSION_NAME}.apk"
          rebuilt=rebuilt/app-release-unsigned.apk
          if apksigcopier compare "$signed" --unsigned "$rebuilt"; then
            echo "Reproduced $(basename "$signed")"
            exit 0
          fi
          # Name the entries that differ. diffoscope gives the full diff.
          python3 - "$signed" "$rebuilt" <<'EOF'
          import sys, zipfile
          a, b = (zipfile.ZipFile(p) for p in sys.argv[1:3])
          ia = {i.filename: i for i in a.infolist()}
          ib = {i.filename: i for i in b.infolist()}
          for name in sorted(ia.keys() | ib.keys()):
              x, y = ia.get(name), ib.get(name)
              if x is None or y is None:
                  print(f"only in {'rebuild' if x is None else 'release'}: {name}")
              elif (x.CRC, x.compress_type) != (y.CRC, y.compress_type):
                  print(f"differs: {name}")
          if [i.filename for i in a.infolist()] != [i.filename for i in b.infolist()]:
              print("entry order differs")
          EOF
          echo "::error title=Sideload APK is not reproducible::The rebuild differs from the signed APK, so no GitHub release is published."
          exit 1

  # A job of its own so the third-party Play upload action never runs where a
  # token can mint attestations or write tags and releases.
  publish:
    name: Attest & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-tip, verify-reproducible]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-v${{ needs.check-tip.outputs.version-name }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION_NAME: ${{ needs.check-tip.outputs.version-name }}
        run: |
          gh release create "v$VERSION_NAME" \
            --repo="$GITHUB_REPOSITORY" \
            --target="$HEAD_SHA" \
            --title="HeightMark v$VERSION_NAME" \
            --generate-notes \
            "dist/heightmark-v$VERSION_NAME.apk" \
            dist/app-release.aab
