name: Release to Google Play Store

# workflow_run is how a release waits for a green CI run. The check-tip job's
# `if:` admits only pushes from this repository, and the checkout pins the
# tested SHA, so no fork-controlled code or ref reaches the signing secrets.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Android CI"]
    branches: [main]
    types:
      - completed

permissions: {}

# The Play Publishing API allows only one open edit per app, so concurrent
# release runs (e.g. from a Dependabot merge batch) invalidate each other.
# Serialize them; intermediate queued runs are superseded by the newest.
concurrency:
  group: play-store-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false

jobs:
  # Releases only main's tip. When a batch of merges lands, the newest commit's
  # release ships every earlier change, so releasing a superseded commit only
  # spends a Play upload. It also fails at the tag: GITHUB_TOKEN may not tag a
  # commit behind main once a later merge has changed workflow files.
  check-tip:
    name: Check commit is main's tip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The `branches` filter above matches the triggering run's head branch, so
    # a fork PR from a branch named `main` also passes it. Only a push to this
    # repository may reach the release job and its signing secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Compare with main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_sha" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release skipped::main has moved to ${main_sha:0:7}; its release ships ${HEAD_SHA:0:7} too."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & Release to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-tip
    if: needs.check-tip.outputs.current == 'true'
    permissions:
      contents: write

    steps:
      # Build the commit CI tested. The workflow_run default is the newest main
      # commit, which may not have passed CI yet.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Calculate version
        id: version
        run: |
          # Base offset to allow room for manual releases
          BASE_CODE=10000
          VERSION_PREFIX="1.0"

          VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          VERSION_NAME="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"

          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "📦 Building version: ${VERSION_NAME} (versionCode: ${VERSION_CODE})"

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Outside the workspace, so no artifact upload glob can reach it.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.bizzarosn.heightmark
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: metadata/whatsnew

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-v${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$VERSION_NAME" \
            --repo="$GITHUB_REPOSITORY" \
            --target="$HEAD_SHA" \
            --title="HeightMark v$VERSION_NAME" \
            --generate-notes \
            app/build/outputs/bundle/release/app-release.aab
