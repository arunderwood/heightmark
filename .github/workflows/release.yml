name: Release to Google Play Store

on:
  workflow_run:
    workflows: ["Android CI"]
    branches: [main]
    types:
      - completed

permissions:
  contents: write

# The Play Publishing API allows only one open edit per app, so concurrent
# release runs (e.g. from a Dependabot merge batch) invalidate each other.
# Serialize them; intermediate queued runs are superseded by the newest.
concurrency:
  group: play-store-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false

jobs:
  release:
    name: Build & Release to Play Store
    runs-on: ubuntu-latest
    # Only run if android_build.yml succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          # Base offset to allow room for manual releases
          BASE_CODE=10000
          VERSION_PREFIX="1.0"

          VERSION_CODE=$((BASE_CODE + ${{ github.run_number }}))
          VERSION_NAME="${VERSION_PREFIX}.${{ github.run_number }}"

          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "📦 Building version: ${VERSION_NAME} (versionCode: ${VERSION_CODE})"

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release AAB
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            --parallel --build-cache

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.bizzarosn.heightmark
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: metadata/whatsnew

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-v${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="HeightMark v${{ steps.version.outputs.name }}" \
            --generate-notes \
            app/build/outputs/bundle/release/app-release.aab
