name: Android CI

on:
  push:
    branches: [ "main" ]
  # No base-branch filter: stacked PRs (targeting another feature branch)
  # need the same quality gates as PRs targeting main
  pull_request:

# Each push to a PR supersedes the run before it. Main runs get a group per
# commit, so none is cancelled or queued behind another: release.yml needs a
# successful CI result for every merged commit.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.configuration-cache=true

jobs:
  # Fast parallel jobs that don't need setup
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Combined job for speed - lint + build + test
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # The default is read-only off main, so PRs restore main's Gradle cache
      # without adding their own entries to the repo's 10 GB cache quota.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run lint, tests, and build
        run: |
          # assembleRelease is the PR gate on R8 and resource shrinking, which no
          # debug task exercises. This job has no signing secrets, so the release
          # APK it produces is unsigned and is never uploaded.
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
        
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: app/build/test-results/testDebugUnitTest/TEST-*.xml
          check_name: Unit Test Results
          comment_mode: always
          
      - name: Report Android Lint Results
        uses: yutailang0119/action-android-lint@97c6d378746eca91f45efedb7c76812b48c88f08 # v6.0.0
        if: always()
        with:
          report-path: app/build/reports/lint-results-debug.xml
          
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # No `needs: build-and-test`: this job builds its own APKs, so the two jobs
  # run side by side. release.yml still waits for both to pass. The job name
  # is a required status check in the main ruleset; renaming it blocks merges.
  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Hosted runners have no GPU, so the emulator renders in software.
      GMD_GPU: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # The default mode, like build-and-test: writes on main, read-only on PRs.
      # This job resolves dependencies no other job does, such as the UTP test
      # runner and its junit-platform artifacts. Without its own main entry,
      # every run downloads them from Maven Central and fails whenever Central
      # does.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle Managed Devices keep their AVDs and default_boot snapshots here.
      # Lock files and the active-device registry describe the emulator that
      # wrote them; restored on another runner they make GMD treat the device
      # as in use.
      - name: Restore managed device cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gmd-cache
        with:
          path: |
            ~/.android/avd/gradle-managed
            !~/.android/avd/gradle-managed/**/*.lock
            !~/.android/avd/gradle-managed/active_gradle_devices
          key: gmd-pixel8proapi35-aospatd-${{ runner.os }}-v1

      # Cache miss only: creates the device and its boot snapshot, so the save
      # below captures them before any test has run. On a hit, the test task's
      # own setup dependency checks the restored device, and skipping this
      # step saves a Gradle start-up and configuration pass.
      - name: Set up managed device
        if: steps.gmd-cache.outputs.cache-hit != 'true'
        run: ./gradlew pixel8proapi35Setup "$GMD_GPU"

      # Only main saves the device. A PR's entry (~1.3 GB) can't be restored by
      # any other ref, and a few of them evict main's from the 10 GB quota.
      - name: Save managed device cache
        if: github.ref == 'refs/heads/main' && steps.gmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/gradle-managed
            !~/.android/avd/gradle-managed/**/*.lock
            !~/.android/avd/gradle-managed/active_gradle_devices
          key: ${{ steps.gmd-cache.outputs.cache-primary-key }}

      - name: Run instrumented tests
        run: ./gradlew pixel8proapi35DebugAndroidTest "$GMD_GPU"

      - name: Upload instrumented test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: instrumented-test-reports
          # androidTest-results holds each test's logcat.
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
