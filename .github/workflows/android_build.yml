name: Android CI

on:
  push:
    branches: [ "main" ]
  # No base-branch filter: stacked PRs (targeting another feature branch)
  # need the same quality gates as PRs targeting main
  pull_request:

# Each push to a PR supersedes the run before it. Main runs get a group per
# commit, so none is cancelled or queued behind another: release.yml needs a
# successful CI result for every merged commit.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # setup-gradle caches ~/.gradle/caches but not the project's
  # .gradle/configuration-cache, so every run reconfigures (about 10-16 s per
  # job). The flag is set here and not in release.yml, whose configuration
  # would write the signing secrets into the cache entry.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.configuration-cache=true

jobs:
  # Combined job for speed - lint + build + test
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # The default is read-only off main, so PRs restore main's Gradle cache
      # without adding their own entries to the repo's 10 GB cache quota.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run lint, tests, and build
        run: |
          # assembleRelease is the PR gate on R8 and resource shrinking, which no
          # debug task exercises. This job has no signing secrets, so the release
          # APK it produces is unsigned and is never uploaded.
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
        
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: app/build/test-results/testDebugUnitTest/TEST-*.xml
          check_name: Unit Test Results
          comment_mode: always
          
      - name: Report Android Lint Results
        uses: yutailang0119/action-android-lint@97c6d378746eca91f45efedb7c76812b48c88f08 # v6.0.0
        if: always()
        with:
          report-path: app/build/reports/lint-results-debug.xml
          
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # No `needs: build-and-test`: this job builds its own APKs, so the two jobs
  # run side by side. release.yml still waits for both to pass.
  #
  # One job per managed device. AGP runs the devices' test tasks one after the
  # other inside a single build, so separate jobs are what makes them run at
  # the same time. The device list must match deviceApiLevels in
  # app/build.gradle.kts.
  instrumented-tests:
    name: ${{ matrix.name }}
    strategy:
      # Each device reports its own result; one failing does not cancel the other.
      fail-fast: false
      matrix:
        include:
          # API 36 keeps the bare job name, which is a required status check in
          # the main ruleset; renaming it blocks merges. It is the device that
          # runs behavior gated on targetSdk.
          - device: pixel8proapi36
            api: 36
            name: Instrumented Tests
          - device: pixel8proapi35
            api: 35
            name: Instrumented Tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Hosted runners have no GPU, so the emulator renders in software.
      GMD_GPU: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      DEVICE: ${{ matrix.device }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must satisfy toolchainVersion AND toolchainVendor in
      # gradle/gradle-daemon-jvm.properties, or Gradle ignores this JDK and
      # provisions its own. Changing distribution here requires updating that
      # file too.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # The default mode, like build-and-test: writes on main, read-only on PRs.
      # This job resolves dependencies no other job does, such as the UTP test
      # runner and its junit-platform artifacts. Without its own main entry,
      # every run downloads them from Maven Central and fails whenever Central
      # does.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image ships no emulator and no system image, so without
      # this cache AGP downloads both on every run. AGP picks what it installs,
      # so each AGP version gets its own entry, which also refreshes the
      # emulator to the newest release whenever AGP is bumped.
      - name: Compute managed device cache key
        id: gmd-key
        run: |
          agp=$(sed -n 's/^agp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$agp" ]; then
            echo "::error title=No AGP version::gradle/libs.versions.toml has no agp = \"...\" line."
            exit 1
          fi
          echo "key=gmd-$DEVICE-aospatd-agp$agp-$RUNNER_OS-v2" >> "$GITHUB_OUTPUT"
          echo "sdk=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      # Gradle Managed Devices keep their AVDs and default_boot snapshots in
      # ~/.android/avd/gradle-managed. The two SDK paths are the emulator and
      # system image that AGP would otherwise download.
      - name: Restore managed device cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gmd-cache
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ steps.gmd-key.outputs.sdk }}/emulator
            ${{ steps.gmd-key.outputs.sdk }}/system-images/android-${{ matrix.api }}/aosp_atd
          key: ${{ steps.gmd-key.outputs.key }}

      # Cache miss only: downloads the emulator and system image, then creates
      # the device and its boot snapshot, so the save below captures them
      # before any test has run. On a hit, the test task's own setup dependency
      # checks the restored device, and skipping this step saves a Gradle
      # start-up and configuration pass.
      #
      # On x86_64 hosts the setup task logs "does not specify a testedAbi".
      # The warning is spurious: that task never receives the DSL value, while
      # the test runner reads it.
      #
      # The emulator keeps writing to the AVD for a few seconds after the
      # Gradle task returns, and tar fails the save when a file changes or
      # disappears mid-read. So wait until no process holds a file in the AVD
      # directory. Then delete the lock files and the active-device registry,
      # which describe an emulator that no longer exists, so no runner restores
      # them. actions/cache `!` patterns cannot drop them, because tar recurses
      # into the directory the path names.
      - name: Set up managed device
        if: steps.gmd-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew "${DEVICE}Setup" "$GMD_GPU"
          avd_dir="$HOME/.android/avd/gradle-managed"
          waited=0
          # lsof's exit status also reflects unrelated warnings, so ignore it
          # and test its output instead. The listing names whatever is still
          # writing, in case the wait ever runs to its limit.
          echo "Processes holding files in $avd_dir after the setup task:"
          lsof +D "$avd_dir" 2>/dev/null || true
          while [ -n "$(lsof -t +D "$avd_dir" 2>/dev/null)" ]; do
            if [ "$waited" -ge 60 ]; then
              echo "::warning title=Emulator still running::A process still holds files in $avd_dir after 60 s, so the cache save may fail."
              break
            fi
            sleep 1
            waited=$((waited + 1))
          done
          echo "Waited ${waited}s for processes to release $avd_dir."
          find "$avd_dir" \( -name '*.lock' -o -name active_gradle_devices \) -print -delete

      # Only main saves the device. A PR's entry (~2.3 GB) can't be restored by
      # any other ref, and a few of them evict main's from the 10 GB quota.
      - name: Save managed device cache
        if: github.ref == 'refs/heads/main' && steps.gmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ steps.gmd-key.outputs.sdk }}/emulator
            ${{ steps.gmd-key.outputs.sdk }}/system-images/android-${{ matrix.api }}/aosp_atd
          key: ${{ steps.gmd-cache.outputs.cache-primary-key }}

      - name: Run instrumented tests
        run: ./gradlew "${DEVICE}DebugAndroidTest" "$GMD_GPU"

      - name: Upload instrumented test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: instrumented-test-reports-${{ matrix.device }}
          # androidTest-results holds each test's logcat.
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
